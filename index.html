<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>GengarAmp</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a0f2e;
            overflow: hidden;
            user-select: none;
        }
        #app {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import Webamp from 'https://unpkg.com/webamp@^2/butterchurn';

        const webamp = new Webamp({
            initialSkin: {
                url: "./gengar.wsz"
            },
            initialTracks: [
                { metaData: { artist: "Diablo Swing Orchestra", title: "Heroines" }, url: "./01 - Diablo Swing Orchestra - Heroines.mp3" },
                { metaData: { artist: "Eclectek", title: "We Are Going To Eclecfunk Your Ass" }, url: "./02 - Eclectek - We Are Going To Eclecfunk Your Ass.mp3" },
                { metaData: { artist: "Auto-Pilot", title: "Seventeen" }, url: "./03 - Auto-Pilot - Seventeen.mp3" },
                { metaData: { artist: "Muha", title: "Microphone" }, url: "./04 - Muha - Microphone.mp3" },
                { metaData: { artist: "Just Plain Ant", title: "Stumble" }, url: "./05 - Just Plain Ant - Stumble.mp3" },
                { metaData: { artist: "Sleaze", title: "God Damn" }, url: "./06 - Sleaze - God Damn.mp3" },
                { metaData: { artist: "Juanitos", title: "Hola Hola Bossa Nova" }, url: "./07 - Juanitos - Hola Hola Bossa Nova.mp3" },
                { metaData: { artist: "Entertainment For The Braindead", title: "Resolutions (Chris Summer Remix)" }, url: "./08 - Entertainment For The Braindead - Resolutions (Chris Summer Remix).mp3" },
                { metaData: { artist: "Nobara Hayakawa", title: "Trail" }, url: "./09 - Nobara Hayakawa - Trail.mp3" },
                { metaData: { artist: "Paper Navy", title: "Tongue Tied" }, url: "./10 - Paper Navy - Tongue Tied.mp3" },
                { metaData: { artist: "60 Tigres", title: "Garage" }, url: "./11 - 60 Tigres - Garage.mp3" },
                { metaData: { artist: "CM aka Creative", title: "The Cycle (Featuring Mista Mista)" }, url: "./12 - CM aka Creative - The Cycle (Featuring Mista Mista).mp3" },
                { metaData: { artist: "Familiada", title: "Family Feud - Romania" }, url: "./Familiada - Family Feud - Romania.mp3" }
            ],
            // This enables the Milkdrop-style visualizer
            __butterchurnOptions: {
                importButterchurn: () => import('https://unpkg.com/butterchurn@2.6.7/lib/butterchurn.min.js'),
                getPresets: () => fetch('https://unpkg.com/butterchurn-presets@2.4.7/lib/butterchurnPresets.min.js').then(res => res.json()),
                butterchurnOpenGLOptions: { preserveDrawingBuffer: true },
            },
        });

        webamp.renderWhenReady(document.getElementById("app")).then(() => {
            webamp.store.dispatch({ type: "SET_DISPLAY_DOUBLE" });
        });
    </script>
</body>
</html>
